*{box-sizing:border-box}html{height:100%}
body{margin:0;min-height:100%;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--tx);background:linear-gradient(135deg,var(--bg1),var(--bg2)) fixed;padding-bottom:84px}

<script>
if(typeof claude==='undefined'){window.claude={use:async()=>null}}

const $=id=>document.getElementById(id),A=$('app');
const rp=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mem={};const ls={get(k){try{const v=localStorage.getItem(k);if(v!==null)return JSON.parse(v)}catch(e){}return k in mem?JSON.parse(mem[k]):null},set(k,v){mem[k]=JSON.stringify(v);try{localStorage.setItem(k,mem[k])}catch(e){}}};
const CO=['Makan','Transport','Belanja','Tagihan','Dana kegemaran','Lainnya'],CI=['Gaji','Bonus','Lainnya'];
let S={u:null,tx:[],cfg:{foya:20,tab:20},tab:'home',ym:new Date().toISOString().slice(0,7),draft:null,busy:false,msg:''};
const th=ls.get('fin:theme');const pl=ls.get('fin:pal');if(pl)applyPal(pl.a,pl.b);if(th)document.documentElement.dataset.theme=th;
function toggleTheme(){const d=document.documentElement,dark=d.dataset.theme?d.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;d.dataset.theme=dark?'light':'dark';ls.set('fin:theme',d.dataset.theme)}
async function hash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(unescape(encodeURIComponent(s)))}}
const save=()=>ls.set('fin:d:'+S.u,{tx:S.tx,cfg:S.cfg,goals:S.goals,bills:S.bills,nick:S.nick});
async function auth(mode){
  const e=$('em').value.trim().toLowerCase(),p=$('pw').value;
  if(!/^\S+@\S+\.\S+$/.test(e))return $('er').textContent='Format email tidak valid';
  if(p.length<6)return $('er').textContent='Kata sandi minimal 6 karakter';
  const acc=ls.get('fin:acc')||{},h=await hash(p);
  if(mode==='reg'){if(acc[e])return $('er').textContent='Email sudah terdaftar';acc[e]=h;ls.set('fin:acc',acc)}
  else{if(!acc[e])return $('er').textContent='Email ini belum terdaftar. Tekan "Daftar akun baru" dulu.';if(acc[e]!==h)return $('er').textContent='Kata sandi salah'}
  S.u=e;ls.set('fin:sess',e);load();render()}
function load(){const d=ls.get('fin:d:'+S.u);S.tx=(d?.tx||[]).map(t=>t.cat==='Foya-foya'?{...t,cat:'Dana kegemaran'}:t);S.nick=d?.nick||'';S.cfg=d?.cfg||{foya:20,tab:20};S.goals=d?.goals||[];S.bills=d?.bills||[]}
function logout(){S.pp=false;S.u=null;ls.set('fin:sess',null);render()}
function calc(ym){
  const m=S.tx.filter(t=>t.date.startsWith(ym));
  const inc=m.filter(t=>t.t==='in').reduce((a,t)=>a+t.amt,0);
  const out=m.filter(t=>t.t==='out');
  const foya=out.filter(t=>t.cat==='Dana kegemaran').reduce((a,t)=>a+t.amt,0);
  const exp=out.reduce((a,t)=>a+t.amt,0)-foya;
  return{m,inc,exp,foya,fb:inc*S.cfg.foya/100,tb:inc*S.cfg.tab/100}}
function saldo(){return S.tx.reduce((a,t)=>a+(t.t==='in'?t.amt:-t.amt),0)}
function chart(){
  const ms=[];let d=new Date(S.ym+'-01');for(let i=5;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);ms.push(x.toISOString().slice(0,7))}
  const v=ms.map(m=>{const c=calc(m);return[c.inc,c.exp+c.foya]}),mx=Math.max(1,...v.flat());
  let s='<svg viewBox="0 0 320 130" width="100%"><defs><linearGradient id="gi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--bl)"/><stop offset="1" style="stop-color:var(--bl);stop-opacity:.6"/></linearGradient><linearGradient id="go" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sa)"/><stop offset="1" style="stop-color:var(--sa);stop-opacity:.6"/></linearGradient></defs>';
  v.forEach((p,i)=>{const x=10+i*52,h1=p[0]/mx*95,h2=p[1]/mx*95;
    s+=`<rect x="${x}" y="${105-h1}" width="20" height="${h1}" rx="6" fill="url(#gi)"/><rect x="${x+22}" y="${105-h2}" width="20" height="${h2}" rx="6" fill="url(#go)"/><text x="${x+21}" y="122" text-anchor="middle">${ms[i].slice(5)}/${ms[i].slice(2,4)}</text>`});
  return s+'</svg><div class="mu"><span class="in">●</span> Pemasukan &nbsp;<span class="out">●</span> Pengeluaran</div>'}
const fmt=v=>String(v??'').replace(/\D/g,'').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const PAL=[['Biru–Salmon',null,null],['Lavender','#a78bfa','#f9a8d4'],['Mint','#2dd4bf','#a3e635'],['Sunset','#fb923c','#f472b6'],['Samudra','#38bdf8','#6366f1'],['Sakura','#f472b6','#fda4af']];
function applyPal(a,b){const s=document.documentElement.style;if(a){s.setProperty('--bl',a);s.setProperty('--sa',b)}else{s.removeProperty('--bl');s.removeProperty('--sa')}}
function setPal(a,b){ls.set('fin:pal',a?{a,b}:null);applyPal(a,b);render()}
function setCustom(){const a=$('ca').value,b=$('cb').value;ls.set('fin:pal',{a,b});applyPal(a,b)}
function pal(){const p=ls.get('fin:pal')||{};return`<div class="card"><div class="row" style="margin-bottom:10px"><h2 style="margin:0">${ic('palette','s')} Warna dan suara</h2><button class="ghost" onclick="toggleSnd()">${S.snd?ic('volOn','s')+' Suara nyala':ic('volOff','s')+' Suara mati'}</button></div><div class="chips">${PAL.map(x=>`<button class="ghost" style="background:linear-gradient(135deg,${x[1]||'#6bb7f2'},${x[2]||'#ff8f7a'});color:#fff;border:0" onclick="setPal(${x[1]?`'${x[1]}','${x[2]}'`:'null,null'})">${x[0]}</button>`).join('')}</div><div class="mu">Atau pilih warnamu sendiri:</div><div class="g2" style="margin-top:6px"><input id="ca" type="color" value="${p.a||'#6bb7f2'}" onchange="setCustom()" style="height:44px;padding:3px"><input id="cb" type="color" value="${p.b||'#ff8f7a'}" onchange="setCustom()" style="height:44px;padding:3px"></div></div>`}
let AC;function beep(){if(!S.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type='sine';o.frequency.setValueAtTime(620,t);o.frequency.exponentialRampToValueAtTime(920,t+.07);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.12);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.13)}catch(e){}}
document.addEventListener('click',e=>{const t=e.target;if(t&&t.closest&&(t.tagName!=='INPUT'||t.type==='file')&&t.closest('button,a,label'))beep()});
function toggleSnd(){S.snd=!S.snd;ls.set('fin:snd',S.snd);render()}
function toggleHide(){S.hide=!S.hide;ls.set('fin:hide',S.hide);render()}
const ICO={home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',list:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',scan:'<path d="M4 8V5a1 1 0 011-1h3M16 4h3a1 1 0 011 1v3M20 16v3a1 1 0 01-1 1h-3M8 20H5a1 1 0 01-1-1v-3"/><circle cx="12" cy="12" r="3.2"/>',wallet:'<path d="M4 7a2 2 0 012-2h12v4"/><path d="M4 7v11a2 2 0 002 2h14V9H6a2 2 0 01-2-2z"/><circle cx="16.5" cy="14.5" r="1" fill="currentColor"/>',eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',eyeOff:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M4 4l16 16"/>',palette:'<path d="M12 3a9 9 0 100 18c1.2 0 1.8-.8 1.8-1.7 0-1.2-1-1.5-1-2.6 0-.9.7-1.5 1.6-1.5H17a4 4 0 004-4c0-4.4-4-8.2-9-8.2z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7.5" r="1"/><circle cx="14.5" cy="7.5" r="1"/>',theme:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 010 18z" fill="currentColor"/>',out:'<path d="M10 4H6a1 1 0 00-1 1v14a1 1 0 001 1h4"/><path d="M15 8l4 4-4 4M19 12H9"/>',volOn:'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/>',volOff:'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/>',plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',coins:'<ellipse cx="12" cy="7" rx="7" ry="3"/><path d="M5 7v5c0 1.7 3.1 3 7 3s7-1.3 7-3V7M5 12v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5"/>',spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M18 16l.8 2.2L21 19l-2.2.8L18 22l-.8-2.2L15 19l2.2-.8z"/>'};
const ic=(n,c)=>`<svg class="ic ${c||''}" viewBox="0 0 24 24" aria-hidden="true">${ICO[n]}</svg>`;
Object.assign(ICO,{plan:'<path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/>',bell:'<path d="M6 16v-5a6 6 0 1112 0v5l1.5 2h-15z"/><path d="M10 21h4"/>',imp:'<path d="M12 4v11M7.5 10.5L12 15l4.5-4.5"/><path d="M4 18v2h16v-2"/>',check:'<path d="M5 12.5l4.5 4.5L19 7"/>'});
const ld=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const num=v=>+String(v||'').replace(/\D/g,'');
const GC=['Acara','Kebutuhan','Tagihan','Liburan','Dana darurat','Pendidikan','Lainnya'];
let tt;function toast(m){const e=$('toast');if(!e)return;e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),4500)}
function go(t){stopCam();S.cam=null;S.tab=t;S.msg='';render();try{scrollTo(0,0)}catch(e){}}
function billInfo(b){const n=new Date(),t0=new Date(n.getFullYear(),n.getMonth(),n.getDate()),dim=new Date(n.getFullYear(),n.getMonth()+1,0).getDate(),due=new Date(n.getFullYear(),n.getMonth(),Math.min(b.day,dim)),diff=Math.round((due-t0)/864e5);if(b.paid===ld().slice(0,7))return{k:'ok',diff:diff+100,txt:'Lunas bulan ini'};if(diff<0)return{k:'late',diff,txt:'Telat '+(-diff)+' hari'};if(diff===0)return{k:'soon',diff,txt:'Jatuh tempo hari ini'};return{k:diff<=3?'soon':'',diff,txt:diff+' hari lagi'}}
function remind(){const l=S.bills.map(b=>({b,i:billInfo(b)})).filter(x=>x.i.k==='late'||x.i.k==='soon');if(!l.length)return'';return`<div class="card"><h2 style="margin-bottom:6px">${ic('bell','s')} Pengingat tagihan</h2>${l.map(x=>`<div class="row"><span>${esc(x.b.name)}</span><b class="${x.i.k==='late'?'out':''}">${x.i.txt}</b></div>`).join('')}<a class="mu" href="#" onclick="go('plan');return false">Lihat semua rencana</a></div>`}
function praise(g,b){const a=g.saved/g.target;b=b/g.target;const rest=rp(Math.max(0,g.target-g.saved)),T=[[1,`Hore! Rencana "${g.name}" tercapai! Kamu hebat dan konsisten.`],[.9,`Sedikit lagi! "${g.name}" tinggal ${rest}. Kamu pasti bisa!`],[.75,`Tiga perempat jalan untuk "${g.name}". Terus semangat!`],[.5,`Setengah jalan untuk "${g.name}". Keren, lanjutkan!`],[.25,`Awal yang bagus untuk "${g.name}". Langkah kecil, hasil besar!`]],h=T.find(x=>a>=x[0]&&b<x[0]);toast(h?h[1]:`Setoran masuk! "${g.name}" sudah ${Math.floor(a*100)}%.`)}
function tpl(x){$('gn').value=x;$('gc').value=x==='Acara keluarga'?'Acara':x==='Kebutuhan bulanan'?'Kebutuhan':x}
function tplB(x){$('bn').value=x}
function addGoal(){const name=$('gn').value.trim(),t=num($('gt').value);if(!name||!(t>0))return toast('Isi nama dan target rencana ya');S.goals.push({id:Date.now()+'',name,cat:$('gc').value,target:t,saved:0,due:$('gd').value});save();render();toast('Rencana "'+name+'" dibuat. Semangat menabung!')}
function deposit(id){const g=S.goals.find(x=>x.id===id),v=num($('dep_'+id).value);if(!g||!(v>0))return toast('Isi nominal setoran dulu');const b=g.saved;g.saved+=v;save();render();praise(g,b)}

function parseNum(s){s=String(s).replace(/[^\d.,-]/g,'');if(!/\d/.test(s))return NaN;const neg=s.includes('-');s=s.replace(/-/g,'');const d=s.lastIndexOf('.'),c=s.lastIndexOf(',');if(d>-1&&c>-1){const p=Math.max(d,c);s=s.slice(0,p).replace(/[.,]/g,'')+'.'+s.slice(p+1)}else if(d>-1||c>-1){const p=Math.max(d,c),cnt=(s.match(/[.,]/g)||[]).length;if(cnt>1||s.length-p-1===3)s=s.replace(/[.,]/g,'');else s=s.slice(0,p)+'.'+s.slice(p+1)}const n=parseFloat(s);return neg?-n:n}
function parseDate(s){s=String(s);let m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');m=s.match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);if(m)return(m[3].length===2?'20'+m[3]:m[3])+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return null}
function splitLine(l,d){const o=[];let c='',q=false;for(const ch of l){if(ch==='"')q=!q;else if(ch===d&&!q){o.push(c.trim());c=''}else c+=ch}o.push(c.trim());return o}
function guess(n,t){n=String(n).toLowerCase();if(t==='in')return/gaji|salary|payroll/.test(n)?'Gaji':'Lainnya';if(/gofood|grabfood|shopeefood|resto|warung|kopi|cafe|makan|bakso/.test(n))return'Makan';if(/gojek|grab|ojek|bensin|pertamina|tol|krl|mrt|kereta/.test(n))return'Transport';if(/pln|listrik|pdam|wifi|indihome|pulsa|bpjs|cicilan|sewa|kos/.test(n))return'Tagihan';if(/tokopedia|shopee|lazada|indomaret|alfamart|market/.test(n))return'Belanja';return'Lainnya'}
function parseCsv(txt){const L=txt.split(/\r?\n/).filter(l=>l.trim());if(!L.length)return[];const dl=[';','\t',','].map(d=>[d,L.slice(0,5).reduce((a,l)=>a+l.split(d).length,0)]).sort((a,b)=>b[1]-a[1])[0][0],rows=L.map(l=>splitLine(l,dl)),hi=rows.findIndex(r=>r.some(c=>/tanggal|date|tgl/i.test(c))&&r.some(c=>/ket|desk|uraian|descr|remark|detail|transaksi|jumlah|amount|debit|kredit|credit|mutasi/i.test(c))),H=hi>-1?rows[hi].map(c=>c.toLowerCase()):[],ix=re=>H.findIndex(c=>re.test(c)),iD=ix(/tanggal|date|tgl/),iN=ix(/ket|desk|uraian|descr|remark|detail|berita/),iDb=ix(/debit|keluar|debet|^db$/),iCr=ix(/kredit|credit|masuk|^cr$/),iA=ix(/jumlah|amount|nominal|mutasi/),iT=ix(/^(d\/k|dk|tipe|type|jenis)$/),out=[];for(const r of rows.slice(hi+1)){const di=iD>-1?iD:r.findIndex(c=>parseDate(c)),date=di>-1?parseDate(r[di]):null;if(!date)continue;const note=iN>-1?r[iN]:(r.filter((c,k)=>k!==di&&/[a-z]{3}/i.test(c)).sort((a,b)=>b.length-a.length)[0]||'');let amt=NaN,t=null;if(iDb>-1||iCr>-1){const db=iDb>-1?parseNum(r[iDb]):NaN,cr=iCr>-1?parseNum(r[iCr]):NaN;if(cr>0){amt=cr;t='in'}else if(db>0){amt=db;t='out'}}else{const k=iA>-1?iA:r.findIndex((c,j)=>j!==di&&/\d/.test(c)&&!parseDate(c)&&Number.isFinite(parseNum(c))&&!/[a-z]{3}/i.test(c));if(k>-1){amt=parseNum(r[k]);const row=r.join(' ');t=/\bCR\b|kredit/i.test(row)?'in':/\bDB\b|debit|debet/i.test(row)?'out':amt<0?'out':'in';if(iT>-1){const v=(r[iT]||'').toLowerCase();t=/^(k|cr|kredit|masuk|in)/.test(v)?'in':/^(d|db|debit|keluar|out)/.test(v)?'out':t}}}amt=Math.round(Math.abs(amt));if(!(amt>0)||!t)continue;out.push({date,note:note||'Mutasi',amt,t,cat:guess(note,t)})}return out}
async function doImp(f){if(!f)return;S.busy=true;S.msg='';S.imp=null;render();try{let rows;if((f.type||'').startsWith('image/')){const sm=await vis();if(!sm)throw{code:'na'};const b=await shrink(f),r=await sm.json('Baca mutasi rekening pada gambar ini. Balas HANYA array JSON: [{"tanggal":"YYYY-MM-DD","keterangan":string,"jumlah":angka rupiah positif tanpa titik,"jenis":"masuk" atau "keluar"}]. Abaikan kolom saldo.',{images:[b],cache:false});if(!Array.isArray(r))throw 0;rows=r.map(x=>({date:parseDate(x.tanggal||'')||ld(),note:x.keterangan||'Mutasi',amt:Math.round(Math.abs(+x.jumlah)),t:x.jenis==='masuk'?'in':'out'})).filter(x=>x.amt>0).map(x=>({...x,cat:guess(x.note,x.t)}))}else{if(/\.(xlsx?|pdf|docx?)$/i.test(f.name||''))throw{code:'fmt'};rows=parseCsv(await f.text())}if(!rows.length)throw{code:'empty'};S.imp={rows:rows.map(x=>{const dup=S.tx.some(t=>t.date===x.date&&t.amt===x.amt&&t.t===x.t);return{...x,dup,on:!dup}})}}catch(e){S.msg=e&&e.code==='na'?'Baca foto mutasi hanya aktif di claude.ai. Gunakan file CSV.':e&&e.code==='fmt'?'Format ini belum didukung. Ekspor mutasi sebagai CSV, atau foto/screenshot-nya.':e&&e.code==='empty'?'Tidak ada transaksi yang terbaca. Pastikan file punya kolom tanggal dan jumlah.':'Gagal membaca file. Coba file CSV atau foto yang lebih jelas.'}S.busy=false;render()}

function imp(){const r=S.imp&&S.imp.rows,n=r?r.filter(x=>x.on).length:0;return camBox('imp')+`<div class="card"><h2>${ic('imp','s')} Impor mutasi</h2><p class="mu">Unggah file mutasi rekening (CSV/TXT dari internet banking) atau foto/screenshot mutasi. Cek dulu hasilnya sebelum disimpan.</p><div class="g2"><label class="btn" style="position:relative">${ic('imp','s')} Pilih file<input class="fi" type="file" onchange="doImp(this.files[0]);this.value=''"></label><label class="btn" style="position:relative">${ic('scan','s')} Buka kamera<input class="fi" type="file" accept="image/*" capture="environment" onchange="doImp(this.files[0]);this.value=''"></label></div><p class="mu">Pilih file memakai pemilih bawaan HP: folder Unduhan, Dokumen, galeri, dan lainnya. Kalau tidak membuka apa-apa, pemilih file diblokir di aplikasi ini: pakai Kamera langsung atau tempel teks mutasi di bawah.</p><button class="btn alt" onclick="openCam('imp')">${ic('scan','s')} Kamera langsung</button><textarea id="pt" class="ta" rows="5" style="margin-top:10px" placeholder="Tempel teks mutasi di sini (salin dari m-banking, e-mail, atau isi file CSV)">${esc(S.ptx||'')}</textarea><button class="ghost" onclick="doPaste()">Baca teks mutasi</button><div class="err">${S.msg}</div>${S.busy?'<div class="mu">Membaca file...</div>':''}</div>`+(r?`<div class="card"><h2>Hasil bacaan (${r.length})</h2>${r.map((x,i)=>`<label class="tx" style="gap:10px;align-items:center"><input type="checkbox" style="width:auto;margin:0" ${x.on?'checked':''} onchange="S.imp.rows[${i}].on=this.checked;render()"><div style="flex:1">${esc(x.note)}<div class="mu">${x.date} - ${x.cat}${x.dup?' - sudah ada':''}</div></div><b class="${x.t}">${x.t==='in'?'+':'-'}${rp(x.amt)}</b></label>`).join('')}<button class="btn" style="margin-top:10px" onclick="commitImp()">Impor ${n} transaksi</button><p class="mu">Pastikan jumlahnya bukan kolom saldo. Hilangkan centang pada baris yang salah.</p></div>`:'')}

const RX=[[/^Tagihan (.+) lunas\. Kerja bagus, tepat waktu!$/,(m,a)=>'Bill '+a+' paid. Great job, right on time!'],[/^Tagihan (.+): (.+)$/,(m,a,b)=>'Bill '+a+': '+tr(b)],[/^[Tt]elat (\d+) hari$/,(m,n)=>n+' days late'],[/^(\d+) hari lagi$/,(m,n)=>'in '+n+' days'],[/^Selamat, rencana "(.+)" tercapai!$/,(m,a)=>'Congratulations, plan "'+a+'" is reached!'],[/^Rencana "(.+)" tinggal (Rp[\d.\-]+) lagi\. Semangat!$/,(m,a,b)=>'Plan "'+a+'" has only '+b+' left. Keep going!'],[/^"(.+)" tinggal (Rp[\d.\-]+) lagi$/,(m,a,b)=>'"'+a+'" has only '+b+' left'],[/^\+(\d+) pemberitahuan lain$/,(m,n)=>'+'+n+' more notifications'],[/^Semua tagihan aman\. Rencana "(.+)" sudah (\d+)%, lanjutkan!$/,(m,a,n)=>'All bills are fine. Plan "'+a+'" is at '+n+'%, keep going!'],[/^Semua tagihan aman\. Rencana "(.+)" menunggu setoran pertamamu\.$/,(m,a)=>'All bills are fine. Plan "'+a+'" is waiting for your first deposit.'],[/^Tiap tanggal (\d+)(.*)$/,(m,d,r)=>'Every month on day '+d+r],[/^Target (\S+) - saran setor (Rp[\d.]+)\/bulan$/,(m,d,r)=>'Target date '+d+' - suggested deposit '+r+'/month'],[/^Tabungan \((\d+)%\)$/,(m,n)=>'Savings ('+n+'%)'],[/^Halo, (.+)$/,(m,a)=>'Hi, '+a],[/^Dana kegemaran \((\d+)%\)$/,(m,n)=>'Hobby fund ('+n+'%)'],[/^(\d+)% dari pemasukan bulan ini$/,(m,n)=>n+'% of income this month'],[/^Terpakai (Rp\S+)$/,(m,a)=>'Spent '+a],[/^dari (Rp\S+)$/,(m,a)=>'of '+a],[/^Hasil bacaan \((\d+)\)$/,(m,n)=>'Results ('+n+')'],[/^Impor (\d+) transaksi$/,(m,n)=>'Import '+n+' transactions'],[/^(\d+) transaksi berhasil diimpor$/,(m,n)=>n+' transactions imported'],[/^(\d{4}-\d{2}-\d{2}) - (.+?)( - sudah ada)?$/,(m,d,c,x)=>d+' - '+tr(c)+(x?' - already exists':'')],[/^(.+) · (\d{4}-\d{2}-\d{2})$/,(m,c,d)=>tr(c)+' · '+d],[/^Rencana "(.+)" dibuat\. Semangat menabung!$/,(m,a)=>'Plan "'+a+'" created. Keep saving!'],[/^Pengingat "(.+)" tersimpan$/,(m,a)=>'Reminder "'+a+'" saved'],[/^Hore! Rencana "(.+)" tercapai! Kamu hebat dan konsisten\.$/,(m,a)=>'Hooray! Plan "'+a+'" is reached! You are amazing and consistent.'],[/^Sedikit lagi! "(.+)" tinggal (Rp[\d.\-]+)\. Kamu pasti bisa!$/,(m,a,b)=>'Almost there! "'+a+'" has only '+b+' left. You can do it!'],[/^Tiga perempat jalan untuk "(.+)"\. Terus semangat!$/,(m,a)=>'Three quarters of the way for "'+a+'". Keep it up!'],[/^Setengah jalan untuk "(.+)"\. Keren, lanjutkan!$/,(m,a)=>'Halfway there for "'+a+'". Nice, keep going!'],[/^Awal yang bagus untuk "(.+)"\. Langkah kecil, hasil besar!$/,(m,a)=>'Great start for "'+a+'". Small steps, big results!'],[/^Setoran masuk! "(.+)" sudah (\d+)%\.$/,(m,a,n)=>'Deposit added! "'+a+'" is already at '+n+'%.']];
function tr(s){if(s in TR)return TR[s];for(const x of RX){const m=s.match(x[0]);if(m)return x[1](...m)}return s}
function trText(t){if(S.lang!=='en')return;const p=t.parentNode;if(!p||/^(TEXTAREA|SCRIPT|STYLE)$/.test(p.tagName))return;const v=t.nodeValue,s=v.trim();if(!s)return;const r=tr(s);if(r!==s)t.nodeValue=v.replace(s,()=>r)}
function trNode(n){if(S.lang!=='en')return;if(n.nodeType===3)return trText(n);if(n.nodeType!==1)return;const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT),L=[];let x;while(x=w.nextNode())L.push(x);L.forEach(trText);n.querySelectorAll('[placeholder],[aria-label]').forEach(e=>['placeholder','aria-label'].forEach(a=>{const v=e.getAttribute(a);if(v){const r=tr(v);if(r!==v)e.setAttribute(a,r)}}))}
try{new MutationObserver(ms=>ms.forEach(m=>{if(m.type==='characterData')trText(m.target);else m.addedNodes.forEach(trNode)})).observe(document.body,{childList:true,subtree:true,characterData:true})}catch(e){}

  return`<div class="card hero"><div class="row"><div><div class="mu" style="color:#fffc">Saldo total</div><div class="big">${S.hide?'Rp •••••••':rp(saldo())}</div></div><button class="ghost" style="background:#ffffff40;border:0;font-size:20px" aria-label="Tampilkan atau sembunyikan saldo" onclick="toggleHide()">${ic(S.hide?'eyeOff':'eye')}</button></div></div><div class="g2" style="margin-bottom:14px"><button class="btn" onclick="quick('in')">${ic('plus','s')} Pemasukan</button><button class="btn" onclick="quick('out')">${ic('minus','s')} Pengeluaran</button><button class="btn" onclick="go('scan')">${ic('scan','s')} Scan struk</button><button class="btn" onclick="go('imp')">${ic('imp','s')} Impor mutasi</button></div>${monthSel()}

function list(){const c=calc(S.ym);

function form(d){const x=d||S.draft||{t:'out',cat:'Belanja',amt:'',note:'',date:new Date().toISOString().slice(0,10)};
  return`<div class="card"><h2>${d?'Cek hasil scan':'Tambah manual'}</h2><select id="ft" onchange="S.draft={...rd(),t:this.value};render()"><option value="out" ${x.t==='out'?'selected':''}>Pengeluaran</option><option value="in" ${x.t==='in'?'selected':''}>Pemasukan</option></select>

function rd(){return{t:$('ft').value,cat:$('fc').value,amt:$('fa').value,note:$('fn').value,date:$('fd').value}}
function quick(t){S.draft={t,cat:t==='in'?'Gaji':'Belanja',amt:'',note:'',date:new Date().toISOString().slice(0,10)};S.tab='list';render();setTimeout(()=>{const e=$('fa');if(e&&e.scrollIntoView)e.scrollIntoView({block:'center'})},50)}

function scan(){return camBox('scan')+`<div class="card"><h2>${ic('scan','s')} Scan struk / harga barang</h2><p class="mu">Foto struk atau label harga, Claude membaca total, tanggal, dan kategorinya. Kamu cukup cek lalu simpan.</p>

function shrink(f){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1280/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(),'image/jpeg',.82)};i.onerror=no;i.src=URL.createObjectURL(f)})}
async function doScan(f){if(!f)return;S.busy=true;S.msg='';render();
  try{const sm=await vis();if(!sm)throw{code:'na'};
    const b=await shrink(f);
    const r=await sm.json('Baca foto struk/label harga ini. Balas HANYA JSON: {"toko":string,"tanggal":"YYYY-MM-DD" atau null,"total":angka rupiah tanpa titik,"kategori":salah satu dari '+CO.join(', ')+',"ringkas":"nama barang utama, maks 6 kata"}.',{images:[b],cache:false});
    S.draft={t:'out',cat:CO.includes(r.kategori)?r.kategori:'Belanja',amt:Math.round(+r.total)||'',note:[r.toko,r.ringkas].filter(Boolean).join(' · '),date:r.tanggal||new Date().toISOString().slice(0,10)}}
  catch(e){S.msg=e&&e.code==='na'?'Baca foto hanya aktif saat halaman dibuka lewat claude.ai. Untuk sementara pakai input manual.':e&&e.code==='not_granted'?'Izin ditolak. Izinkan Claude membaca foto lalu coba lagi.':e&&e.code==='rate_limited'?'Terlalu banyak permintaan, coba lagi sebentar.':'Gagal membaca foto, coba foto yang lebih jelas dan terang.'}
  S.busy=false;render()}

function login(){return`<div class="card" style="margin-top:12vh"><h1>SakuRapi ${ic('spark','s')}</h1><p class="mu">Catat uang, scan struk, atur tabungan dan dana kegemaran.</p>
  <input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Kata sandi (min. 6)" autocomplete="current-password"><div class="err" id="er"></div>
  <button class="btn" onclick="auth('in')">Masuk</button><div style="height:8px"></div><button class="ghost" style="width:100%" onclick="auth('reg')">Daftar akun baru</button>
  <p class="mu">Pertama kali? Isi email dan sandi, lalu tekan <b>Daftar akun baru</b>. Data tersimpan di perangkat ini saja.</p><button class="ghost" onclick="toggleTheme()">${ic('theme','s')} Gelap / Terang</button> <button class="ghost" onclick="setLang(S.lang==='en'?'id':'en')">${S.lang==='en'?'Bahasa Indonesia':'English'}</button></div>`}
function render(){
  if(!S.u){A.innerHTML=login();return}
  const v={home,list,scan,plan,imp,wallet}[S.tab]();
  const n=[['home','home','Beranda'],['list','list','Transaksi'],['plan','plan','Rencana'],['wallet','wallet','Dompet']];
  const sc=$('sheet')?$('sheet').scrollTop:0;A.innerHTML=head()+v+`<nav>${n.map(x=>`<button class="${S.tab===x[0]?'on':''}" onclick="stopCam();S.cam=null;S.tab='${x[0]}';S.msg='';render()"><b>${ic(x[1])}</b>${x[2]}</button>`).join('')}</nav>`+(S.pp?settings():'');const sh=$('sheet');if(sh)sh.scrollTop=sc}
S.lang=ls.get('fin:lang')==='en'?'en':'id';document.documentElement.lang=S.lang;S.hide=!!ls.get('fin:hide');S.snd=ls.get('fin:snd')!==false;const ss=ls.get('fin:sess');if(ss){S.u=ss;load()}render();

if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
